spring.application.name=ceppa_back

spring.profiles.active=local

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:3456/realms/Ceppa

spring.datasource.url=jdbc:postgresql://localhost:5432/ceppa
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG
logging.level.org.flywaydb.core=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG